services:
  backend:
    build: ./core
    restart: unless-stopped
    user: "${CONTAINER_USER:-app}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${VAULT_PATH:?set VAULT_PATH to the vault folder}"
        target: /vault
        read_only: true
        bind:
          selinux: z
          create_host_path: false

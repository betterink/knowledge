name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tablet-mac-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install qt
      - run: python3 tools/tablet.py test

  tablet-device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tablet.py build
      - uses: actions/upload-artifact@v4
        with:
          name: rm-knowledge-tablet
          path: dist/rm-knowledge.tar.gz

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
